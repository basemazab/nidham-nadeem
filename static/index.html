<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نِظام Assistant | منصة نِظام HR</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }
  body { min-height:100vh; background:linear-gradient(160deg,#0f2027,#203a43,#2c5364); display:flex; justify-content:center; padding:20px; }
  .wrap { width:100%; max-width:480px; display:flex; flex-direction:column; height:calc(100vh - 40px); }
  header { text-align:center; color:#fff; padding:18px 0 10px; }
  .logo { font-size:26px; font-weight:800; letter-spacing:.5px; }
  .logo b { color:#4fd1c5; }
  .sub { color:rgba(255,255,255,.65); font-size:14px; margin-top:2px; }
  #chat { flex:1; overflow-y:auto; padding:16px 4px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:11px 15px; border-radius:18px; line-height:1.7; font-size:15.5px; animation:pop .25s ease; }
  @keyframes pop { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
  .bot { align-self:flex-start; background:#fff; color:#1a2b33; border-bottom-right-radius:6px; }
  .user { align-self:flex-end; background:#4fd1c5; color:#08302c; border-bottom-left-radius:6px; font-weight:500; }
  .sys { align-self:center; color:rgba(255,255,255,.55); font-size:13px; }
  .controls { padding:14px 0 8px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  #micBtn { width:88px; height:88px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(145deg,#4fd1c5,#38b2ac); color:#fff; font-size:38px;
    box-shadow:0 8px 24px rgba(79,209,197,.45); transition:transform .15s, box-shadow .3s; }
  #micBtn:hover { transform:scale(1.05); }
  #micBtn.rec { background:linear-gradient(145deg,#fc8181,#e53e3e); animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,62,62,.55)} 70%{box-shadow:0 0 0 24px rgba(229,62,62,0)} 100%{box-shadow:0 0 0 0 rgba(229,62,62,0)} }
  #status { color:rgba(255,255,255,.75); font-size:14.5px; height:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">نِظام <b>Assistant</b></div>
    <div class="sub">المساعد الذكي لمنصة نِظام HR — اتكلم معاه صوت بصوت 👇</div>
  </header>
  <div id="chat">
    <div class="msg bot">أهلاً بيك في نِظام! 🌟 أنا نِظام Assistant، المساعد الذكي بتاع المنصة.<br>اسألني عن المرتبات، التأمينات، الحضور والبصمة… وأحجزلك ديمو مجاني.</div>
  </div>
  <div class="controls">
    <button id="micBtn" title="اضغط واتكلم">🎙️</button>
    <div id="status">دوس على المايك وابدأ تتكلم</div>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const status = document.getElementById('status');
let sid = localStorage.getItem('nadeem_sid');
if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('nadeem_sid', sid); }
const urlK = new URLSearchParams(location.search).get('k') || '';

let mediaRecorder = null, chunks = [], recording = false;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function send(blob) {
  status.textContent = 'بفهمك...';
  const fd = new FormData();
  fd.append('file', blob, 'speech.webm');
  fd.append('session_id', sid);
  fd.append('k', urlK);
  try {
    const res = await fetch('/api/talk', { method:'POST', body: fd });
    const data = await res.json();
    if (data.error) { status.textContent = data.error; return; }
    addMsg(data.client_text, 'user');
    addMsg(data.reply, 'bot');
    status.textContent = '🔊 نِظام Assistant بيتكلم...';

    const bin = atob(data.audio);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: data.mime || 'audio/mpeg' }));
    const player = new Audio(url);
    player.onended = () => status.textContent = 'دوس على المايك وابدأ تتكلم';
    await player.play();
  } catch (e) {
    status.textContent = 'حصلت مشكلة — جرب تاني';
  }
}

async function toggle() {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type:'audio/webm' });
        if (blob.size > 2000) send(blob); else status.textContent = 'التسجيل كان قصير — جرب تاني';
      };
      mediaRecorder.start();
      recording = true;
      micBtn.classList.add('rec');
      micBtn.textContent = '⏹️';
      status.textContent = '🔴 بيسمعك... دوس تاني لما تخلص';
    } catch (e) {
      status.textContent = 'اسمح بالوصول للمايك من إعدادات المتصفح';
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    micBtn.classList.remove('rec');
    micBtn.textContent = '🎙️';
    status.textContent = 'ببعت كلامك...';
  }
}

micBtn.onclick = toggle;
</script>
</body>
</html>
